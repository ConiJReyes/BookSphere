<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Detalles Libro</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" class="ion-padding">
  <div class="portada-container">
    <ion-img *ngIf="libro?.portada" [src]="libro?.portada" class="portada-img"></ion-img>
  </div>
  <ion-card class="info-card">

    <ion-card-content>
      <h6>{{ libro?.titulo }}</h6>
      <p>{{ libro?.autor }} | {{ libro?.nombre_categoria }} | {{ libro?.paginas }} páginas </p>
      <p>ISBN: {{ libro?.ISBN }} </p>
    </ion-card-content>
  </ion-card>

  <ion-card class="descripcion-libro-api">
    <ion-card-content>
      <p>{{ libro?.sinopsis || libro?.descripcion }}</p>
    </ion-card-content>

  </ion-card>



  <div class="sinopsislibro">
    <div class="button-container">
      <ion-button class="custom-button" (click)="anadirGuardados()">Guardar Libro</ion-button>
    </div>

  </div>
</ion-content>
