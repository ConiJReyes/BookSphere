<ion-header [translucent]="true">

  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Añadir Libros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="container">
    <ion-label>Añadir Libro</ion-label>
    <ion-item>
      <ion-input [(ngModel)]="isbnLibAnadir" label="ISBN" labelPlacement="floating"
        placeholder="Ingrese el ISBN del libro"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input [(ngModel)]="nomLibAnadir" label="Titulo" labelPlacement="floating"
        placeholder="Ingrese el nombre del libro"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input [(ngModel)]="autorLibAnadir" label="Autor" labelPlacement="floating"
        placeholder="Ingrese el nombre del autor"></ion-input>
    </ion-item>
    <ion-item>
      <ion-select [(ngModel)]="categoriaLibAnadir" label="Categoría" label-placement="floating" placeholder="Seleccione una categoría">
        <ion-select-option value="1">Ficción</ion-select-option>
        <ion-select-option value="2">No Ficción</ion-select-option>
        <ion-select-option value="3">Juveniles</ion-select-option>
        <ion-select-option value="4">Académicos</ion-select-option>
        <ion-select-option value="5">Especializados</ion-select-option>
        <ion-select-option value="6">Comedia</ion-select-option>
        <ion-select-option value="7">Terror</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item>
      <ion-input type="number" [(ngModel)]="paginasLibAnadir" (keydown)="validarInputPaginas($event)" label="Páginas" labelPlacement="floating"
        placeholder="Ingrese cantidad de páginas"></ion-input>
    </ion-item>
    <ion-item>
      <ion-textarea [(ngModel)]="sinopsisLibAnadir" class="input-desc" label="Sinopsis" labelPlacement="floating"
        placeholder="Ingrese una descripción"></ion-textarea>
    </ion-item>
    <ion-button color="light" (click)="ingresarImagen()" >Ingrese La Portada <ion-icon slot="end" name="image-outline"></ion-icon> </ion-button>
    <img *ngIf="urlImagen" [src]="urlImagen" alt="sin image">


    <ion-button color="primary" shape="round" (click)="validacionAnadirLibro()">Añadir Libro</ion-button>

  </div>

</ion-content>
